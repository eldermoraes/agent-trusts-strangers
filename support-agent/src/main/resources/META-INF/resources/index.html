<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Support panel</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.7/marked.min.js"></script>
<style>
  body { margin: 0; padding: 24px; background: #f4f5f7; color: #1c1c1c; font: 16px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; max-width: 900px; }
  header { display: flex; align-items: baseline; gap: 14px; margin-bottom: 18px; }
  h1 { font-size: 20px; margin: 0; }
  #stage { font-size: 13px; padding: 3px 10px; border-radius: 999px; background: #ffe9c6; color: #7a4b00; }
  #stage.safe { background: #d9f5df; color: #0f5a25; }
  form { display: flex; gap: 8px; margin-bottom: 18px; }
  input { flex: 1; font: inherit; padding: 10px 12px; border: 1px solid #cfd2d6; border-radius: 8px; }
  button { font: inherit; padding: 10px 16px; border: 0; border-radius: 8px; background: #1f6feb; color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; }
  .msg { padding: 12px 16px; border-radius: 10px; margin: 10px 0; background: #fff; border: 1px solid #e3e5e8; }
  .msg.user { background: #eef3ff; }
  .msg.blocked { background: #fff1f0; border-color: #ffb3ad; }
  .msg .who { font-size: 12px; color: #6b7280; margin-bottom: 4px; }
  .msg img { max-width: 100%; }
  .msg pre { background: #f0f0f0; padding: 8px; overflow: auto; }
  .hint { font-size: 13px; color: #6b7280; }
</style>
</head>
<body>
<header><h1>Support panel</h1><span id="stage">…</span></header>
<form id="f">
  <input id="q" autocomplete="off" placeholder="Ask the assistant…" value="Summarize the open tickets and answer the ones you can.">
  <button id="send">Send</button>
</form>
<p class="hint">The reply is rendered as Markdown, like any modern support tool would.</p>
<div id="log"></div>
<script>
const log = document.getElementById('log');
async function stage() {
  const s = await (await fetch('/api/stage')).json();
  const el = document.getElementById('stage');
  el.textContent = s.label; el.className = s.stage >= 5 ? 'safe' : '';
}
function add(who, html, cls) {
  const d = document.createElement('div'); d.className = 'msg ' + cls;
  d.innerHTML = `<div class="who">${who}</div>${html}`;
  log.prepend(d);
}
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const q = document.getElementById('q').value.trim(); if (!q) return;
  const btn = document.getElementById('send'); btn.disabled = true;
  add('Alice (support)', marked.parseInline(q), 'user');
  try {
    const r = await (await fetch('/api/chat', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({message: q})})).json();
    add('Assistant', marked.parse(r.reply || ''), r.blocked ? 'blocked' : '');
  } catch (err) {
    add('Assistant', '<em>request failed: ' + err + '</em>', 'blocked');
  } finally {
    btn.disabled = false; stage();
  }
});
stage(); setInterval(stage, 3000);
</script>
</body>
</html>
