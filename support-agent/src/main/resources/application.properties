quarkus.http.port=8080

# ---------------------------------------------------------------------------
# The talk runs in stages. Each stage keeps every defense from the one before.
#   0  trusting agent, no defense (the baseline attack)
#   1  R0  input guardrail on the user message (PatternBasedPromptInjectionGuardrail)
#   2  R1  spotlighting: tool results wrapped as untrusted data + policy in the system prompt
#   3  R2  least privilege: the agent loses the external e-mail tool
#   4  R3  tool input guardrail on replyToTicket: only the ticket owner's data may leave
#   5  R4  output guardrail on the final answer + CSP on the panel
#   6  R5  tools scoped to the ticket the Operator asked about (server-side)
# Switch with -Ddemo.stage=N (or edit here; dev mode hot-reloads).
# ---------------------------------------------------------------------------
demo.stage=0
# R1 detail: false = fixed delimiter (the stranger can close it), true = random nonce per call
demo.spotlight.nonce=true
# Isolate one defense (e.g. demo.only=6 shows the scoped tools by themselves); empty = cumulative stages
demo.only=
# Hosts the final answer may link to or embed images from (R4)
demo.allowed-hosts=localhost:8080

# --- Model -----------------------------------------------------------------
quarkus.langchain4j.ollama.base-url=http://localhost:11434
quarkus.langchain4j.ollama.chat-model.model-id=gpt-oss:20b-cloud
quarkus.langchain4j.ollama.chat-model.temperature=0
quarkus.langchain4j.ollama.chat-model.seed=42
quarkus.langchain4j.ollama.chat-model.model-options.think=false
quarkus.langchain4j.ollama.chat-model.model-options.num-ctx=8192
quarkus.langchain4j.ollama.timeout=180s
quarkus.langchain4j.max-tool-executions-per-request=8
quarkus.langchain4j.ollama.log-requests=true
quarkus.langchain4j.ollama.log-responses=true

# --- MCP client: the ticketing system -----------------------------------------
quarkus.langchain4j.mcp.tickets.transport-type=streamable-http
quarkus.langchain4j.mcp.tickets.url=http://localhost:8081/mcp
quarkus.langchain4j.mcp.tickets.log-requests=true
quarkus.langchain4j.mcp.tickets.log-responses=true
# We provide our own ToolProvider (see SpotlightingToolProvider) so R1 can wrap tool results.
quarkus.langchain4j.mcp.generate-tool-provider=false
quarkus.langchain4j.mcp.health.enabled=false

# --- Downstream systems the local tools call -----------------------------------
quarkus.rest-client.tickets.url=http://localhost:8081
quarkus.rest-client.stranger.url=http://localhost:8082

# --- Tests: no model, no MCP server ---------------------------------------------
%test.quarkus.http.port=0
%test.quarkus.langchain4j.mcp.enabled=false
%test.quarkus.langchain4j.ollama.enable-integration=false
