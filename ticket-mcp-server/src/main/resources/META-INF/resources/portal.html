<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acme Support · Help center</title>
<link rel="stylesheet" href="portal.css">
</head>
<body>
<header>
  <h1>Acme Support</h1>
  <span class="tag">Help center</span>
  <span class="note">Anyone can open a ticket. No account needed.</span>
</header>

<!-- The public form. The same page for every customer, and for the Stranger. -->
<section id="new">
  <h2>Open a ticket</h2>
  <form id="f">
    <label for="email">Your e-mail</label>
    <input id="email" name="email" type="email" autocomplete="off" placeholder="you@example.com" required>
    <label for="subject">Subject</label>
    <input id="subject" name="subject" autocomplete="off" placeholder="What is it about?" required>
    <label for="message">Message</label>
    <textarea id="message" name="message" rows="10" placeholder="Tell us what happened" required></textarea>
    <div class="actions">
      <button id="submit" type="submit">Open ticket</button>
      <span id="error" role="alert"></span>
    </div>
  </form>
</section>

<!-- After sending: the customer follows the ticket and its replies here. -->
<section id="view" hidden>
  <div class="ticket-head">
    <h2>Ticket <span id="t-id"></span></h2>
    <span id="t-status" class="status"></span>
    <a id="again" href="portal.html">Open another ticket</a>
  </div>
  <div class="meta"><span id="t-subject"></span> · from <span id="t-from"></span></div>
  <div class="label">Your message</div>
  <div id="t-body" class="body"></div>
  <div class="label">Replies from support</div>
  <div id="t-replies"></div>
</section>

<script src="portal.js"></script>
</body>
</html>
